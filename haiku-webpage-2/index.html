<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lighting One Candle</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #f2f2f2;
            color: #333333;
            margin: 0;
            padding: 40px 0;
        }
        .container {
            width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 42px;
        }
        .author {
            font-style: italic;
            margin-top: 0;
            margin-bottom: 40px;
            font-size: 20px;
        }
        img {
            width: 1200px;
            display: block;
            margin-bottom: 40px;
        }
        .haiku {
            font-size: 30px;
            line-height: 1.8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lighting One Candle</h1>
        <p class="author">by Yosa Buson</p>
        <img src="img/candle.jpeg" alt="Image inspired by the haiku">
        <p class="haiku">
            the light of a candle,<br>
            is transferred to another candle,<br>
            spring twilight.
        </p>
    </div>
</body>
</html>
